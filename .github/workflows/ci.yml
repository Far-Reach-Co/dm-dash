name: CI

on:
  pull_request:
  push:
    branches:
      - navel
      - main

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Build TypeScript
        run: npm run build

      - name: Build frontend bundles
        run: SERVER_ENV=prod npm run build:client
